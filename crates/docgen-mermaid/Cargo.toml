[package]
name = "docgen-mermaid"
description = "Mermaid diagram rendering for docgen via the headless Rust `merman` engine."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
docgen-core = { workspace = true }
# default-features off: the math (katex/ratex) chain is the only thing
# pulling wasm-bindgen placeholders into wasm32-unknown-unknown builds.
# The `math` feature below restores it for native builds.
merman = { workspace = true, features = [
    "all-diagrams",
    "svg",
    "layout-elk",
    "png",
] }
# Direct dep only to name `RenderResourcePolicy` (merman doesn't re-export
# its render crate); features arrive through merman's forwarding.
merman-render = { workspace = true }
# The PDF engine's embedded font set, registered into merman-export's raster
# fontdb (via the `merman::svg::export` re-export) before the first PNG
# render: on wasm32-unknown-unknown the raster fontdb has no system fonts, so
# without this every mermaid PNG label is silently dropped. Same crate/bytes
# docgen-typst links — nothing new in the binary.
typst-assets = { version = "0.15.1", features = ["fonts"] }
thiserror = { workspace = true }

[features]
default = ["math"]
math = ["merman/math"]

[dev-dependencies]
sha2 = "0.10"
docgen-core = { workspace = true }
