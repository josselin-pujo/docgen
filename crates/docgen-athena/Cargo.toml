[package]
name = "docgen-athena"
description = "Athena tool component for docgen: `athena:tool@0.1.0` / world `athena-invoke`, zero imports."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
docgen-core = { workspace = true }
docgen-typst = { workspace = true }
# Math (mermaid math labels via merman's katex chain) builds with zero host
# imports now that the vendored ratex-unicode-font patch gates its
# system-fonts/web-sys dependency off for wasm32 — asserted by
# tests/imports.rs. KaTeX fonts are embedded (ratex-svg/embed-fonts); the
# CJK/emoji fallback discovery simply finds nothing on wasm, which every
# caller already handles.
docgen-mermaid = { workspace = true, features = ["math"] }
docgen-office = { workspace = true }
docgen-excalidraw = { workspace = true, features = ["raster"] }
wit-bindgen = "0.62"
# Custom backend for wasm32-unknown-unknown: deterministic stub instead of
# host entropy, so the module keeps importing nothing.
getrandom = { version = "0.2", features = ["custom"] }

[dev-dependencies]
wasmparser = "0.246"
wasmtime = "48"
anyhow = "1"
