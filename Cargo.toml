[workspace]
resolver = "2"
members = [
    "crates/docgen-core",
    "crates/docgen-typst",
    "crates/docgen-mermaid",
    "crates/docgen-excalidraw",
    "crates/docgen-office",
    "crates/docgen-wasm",
    "crates/docgen-athena",
    "crates/docgen-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
docgen-core = { path = "crates/docgen-core" }
docgen-typst = { path = "crates/docgen-typst" }
docgen-mermaid = { path = "crates/docgen-mermaid", default-features = false }
docgen-excalidraw = { path = "crates/docgen-excalidraw" }
docgen-office = { path = "crates/docgen-office" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
pulldown-cmark = "0.13"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
similar = "3.2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.42"

typst = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
ecow = "0.2"

merman = { version = "0.8.0-alpha.7", default-features = false }
# Pinned with `=` to match merman's own pin, so the two resolve to one copy.
merman-render = { version = "=0.8.0-alpha.7", default-features = false }

# Vendored (third-party/, unmodified upstream unless the crate's VENDORED.md
# says otherwise). Two fixes docgen needs that aren't upstream yet — drop the
# patches when an upstream release ships equivalents:
# - merman-export (MIT OR Apache-2.0): register_raster_fonts() — feeds extra
#   font bytes (the typst-assets set) into the shared raster fontdb, whose
#   system-font load is a no-op on wasm32-unknown-unknown, where all mermaid
#   PNG label text would otherwise be dropped.
# - ratex-unicode-font (MIT): system-fonts (locale-aware discovery) pulled
#   web-sys/wasm-bindgen onto the import-free wasm component; the dep and its
#   only use are cfg-gated off for wasm32, letting merman's math feature (the
#   mermaid math-label chain) build with zero imports.
[patch.crates-io]
merman-export = { path = "third-party/merman-export" }
ratex-unicode-font = { path = "third-party/ratex-unicode-font" }

# Size-tuned on purpose (measured table in README "Release profile").
# WARNING: fat LTO + codegen-units=1 make a FULL release build take 12–16
# minutes (almost all of it the LTO link) — including the wasm release
# builds. Iterate with debug builds / `cargo check`; never spin a release
# build inside a debug loop, and don't weaken this profile to "fix" slow
# builds — the size win is the point.
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = "symbols"
