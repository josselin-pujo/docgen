[workspace]
resolver = "2"
members = [
    "crates/docgen-core",
    "crates/docgen-typst",
    "crates/docgen-mermaid",
    "crates/docgen-excalidraw",
    "crates/docgen-office",
    "crates/docgen-wasm",
    "crates/docgen-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
docgen-core = { path = "crates/docgen-core" }
docgen-typst = { path = "crates/docgen-typst" }
docgen-mermaid = { path = "crates/docgen-mermaid", default-features = false }
docgen-excalidraw = { path = "crates/docgen-excalidraw" }
docgen-office = { path = "crates/docgen-office" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
pulldown-cmark = "0.13"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
similar = "3.2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.42"

typst = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
ecow = "0.2"

merman = { version = "0.8.0-alpha.7", default-features = false }

[profile.release]
lto = "thin"
strip = "symbols"
